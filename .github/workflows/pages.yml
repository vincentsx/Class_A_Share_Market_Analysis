name: Publish reports to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      reuse_deployed:
        description: Refresh interface using the last deployed public artifact
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public interface
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download public report bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_REPOSITORY: ${{ github.repository }}
          REUSE_DEPLOYED: ${{ inputs.reuse_deployed && 'true' || 'false' }}
        run: |
          if [ "$REUSE_DEPLOYED" = "true" ]; then
            report_run_id=$(gh run list --repo "$REPORT_REPOSITORY" --workflow pages.yml --limit 20 --json databaseId,status,conclusion --jq 'map(select(.status == "completed" and .conclusion == "success"))[0].databaseId')
            gh run download "$report_run_id" --repo "$REPORT_REPOSITORY" --name github-pages --dir previous
          else
            gh release download pages-report-data --repo "$REPORT_REPOSITORY" --pattern site.tar.gz
          fi
          mkdir site
          python3 - <<'PY'
          import os
          import tarfile
          path = 'previous/artifact.tar' if os.environ['REUSE_DEPLOYED'] == 'true' else 'site.tar.gz'
          with tarfile.open(path) as archive:
              archive.extractall('site', filter='data')
          PY
          test -f site/index.html
          test -f site/manifest.json
      - name: Refresh public live interface
        env:
          REPORT_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -m pip install 'Jinja2>=3.1,<4'
          python3 .github/scripts/refresh_public_ui.py site "$REPORT_REPOSITORY"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
